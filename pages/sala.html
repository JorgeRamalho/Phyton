<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sala de aula em vídeo — Python do iniciante ao avançado | PhytonFree</title>
  <meta name="description" content="Sala de aula PhytonFree com vídeos de Python do iniciante ao avançado até a conclusão: playlist, notas da aula e marcação de progresso.">
  <link rel="canonical" href="https://phytonfree.local/pages/sala.html">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Sala de aula PhytonFree">
  <meta property="og:description" content="Assista à trilha em vídeo e marque cada aula até a conclusão final.">
  <meta property="og:locale" content="pt_BR">
  <meta name="theme-color" content="#10182A">
  <link rel="icon" href="../assets/brand/python-logo.svg" type="image/svg+xml">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/foundation/tokens.css">
  <link rel="stylesheet" href="../css/foundation/base.css">
  <link rel="stylesheet" href="../css/layout/layout.css">
  <link rel="stylesheet" href="../css/components/components.css">
  <link rel="stylesheet" href="../css/pages/pages.css">
</head>
<body data-page="sala" data-root="../">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <div id="app-header"></div>
  <div id="status-bar"></div>
  <main id="conteudo" class="wrap">
    <header class="section-head" style="padding-top:2rem">
      <div>
        <p class="kicker" id="lesson-kicker">Sala de aula</p>
        <h1 id="lesson-title">Carregando aula</h1>
        <p class="caption" id="lesson-meta">Trilha completa</p>
      </div>
      <div>
        <a class="btn btn-ghost" id="prev-lesson" href="sala.html">Aula anterior</a>
        <a class="btn" id="next-lesson" href="sala.html">Próxima aula</a>
      </div>
    </header>
    <section class="classroom">
      <div>
        <div class="video-frame">
          <iframe id="player" title="Vídeo da aula de Python" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
        </div>
        <article class="card" style="margin-top:1rem">
          <p class="kicker">Notas da aula</p>
          <p class="notes" id="lesson-notes"></p>
          <p><button class="btn btn-gold" type="button" id="mark-done">Marcar como concluída</button></p>
        </article>
      </div>
      <aside>
        <p class="kicker">Playlist</p>
        <h2>Do zero à conclusão</h2>
        <nav class="lesson-list" id="lesson-list" aria-label="Aulas da trilha"></nav>
      </aside>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="../js/core/paths.js"></script>
  <script src="../js/core/data.js"></script>
  <script src="../js/core/store.js"></script>
  <script src="../js/core/shell.js"></script>
  <script src="../js/pages/sala.js"></script>
</body>
</html>

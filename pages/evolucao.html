<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curva de aprendizado e evolução no conteúdo — PhytonFree</title>
  <meta name="description" content="Interface de evolução no conteúdo Python: curva de aprendizado, barras por módulo e linha do tempo das aulas da trilha.">
  <link rel="canonical" href="https://phytonfree.local/pages/evolucao.html">
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Evolução PhytonFree">
  <meta property="og:description" content="Acompanhe a curva de aprendizado do iniciante à conclusão.">
  <meta property="og:locale" content="pt_BR">
  <meta name="theme-color" content="#10182A">
  <link rel="icon" href="../assets/brand/python-logo.svg" type="image/svg+xml">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/foundation/tokens.css">
  <link rel="stylesheet" href="../css/foundation/base.css">
  <link rel="stylesheet" href="../css/layout/layout.css">
  <link rel="stylesheet" href="../css/components/components.css">
  <link rel="stylesheet" href="../css/pages/pages.css">
</head>
<body data-page="evolucao" data-root="../">
  <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
  <div id="app-header"></div>
  <div id="status-bar"></div>
  <main id="conteudo" class="wrap">
    <header class="section-head" style="padding-top:2rem">
      <div>
        <p class="kicker">Evolução no conteúdo</p>
        <h1>A curva que o estudo desenha</h1>
        <p class="lede" id="curve-copy">Cada aula e cada exercício empurra o traço para cima. Os nós dourados marcam módulos já habitados.</p>
      </div>
      <p class="badge badge-gold" id="curve-label">0% da trilha</p>
    </header>
    <figure class="card curve-wrap">
      <figcaption class="legend">Figura — curva de aprendizado da trilha PhytonFree, do fundamento à conclusão.</figcaption>
      <svg viewBox="0 0 700 250" role="img" aria-labelledby="curve-title">
        <title id="curve-title">Gráfico da curva de aprendizado</title>
        <defs>
          <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#4C8DDE"/>
            <stop offset="0.55" stop-color="#7EB6FF"/>
            <stop offset="1" stop-color="#F4C430"/>
          </linearGradient>
        </defs>
        <path d="M20 220 C 120 220, 160 170, 250 155 S 390 120, 480 90 S 620 40, 680 30" stroke="rgba(255,255,255,.12)" stroke-width="4" fill="none"/>
        <path id="curve" class="curve-path" d="M20 220 C 120 220, 160 170, 250 155 S 390 120, 480 90 S 620 40, 680 30"/>
        <g id="curve-nodes"></g>
        <text x="20" y="242" fill="#c9d2e4" font-size="12" font-family="Source Serif 4, serif">Início</text>
        <text x="640" y="242" fill="#F4C430" font-size="12" font-family="Source Serif 4, serif">Conclusão</text>
      </svg>
    </figure>
    <section class="section split">
      <div class="card">
        <p class="kicker">Domínio por módulo</p>
        <h2>Barras da trilha</h2>
        <div id="skill-bars" class="exercise-list"></div>
      </div>
      <div>
        <p class="kicker">Linha do tempo</p>
        <h2>Do iniciante ao avançado</h2>
        <div class="timeline" id="history"></div>
      </div>
    </section>
  </main>
  <div id="app-footer"></div>
  <script src="../js/core/paths.js"></script>
  <script src="../js/core/data.js"></script>
  <script src="../js/core/store.js"></script>
  <script src="../js/core/shell.js"></script>
  <script src="../js/pages/evolucao.js"></script>
</body>
</html>
